server:
  port: 8081

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8082
          predicates:
            - Path=/auth/**
        - id: customer-service
          uri: http://customer-service:8083
          predicates:
            - Path=/customers/**
  security:
    oauth2:
      resourceserver:
        jwt: 
          secret-key: ${JWT_SECRET}