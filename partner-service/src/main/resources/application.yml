server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/partner_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: redis
      port: 6379

member:
  service:
    url: http://member-service:8084

resilience4j:
  circuitbreaker:
    instances:
      customerService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      customerService:
        timeoutDuration: 3s

logging:
  level:
    io.github.resilience4j.circuitbreaker: DEBUG